name: docs

# Build the VitePress showcase site and deploy it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Published at https://sdcorejs.github.io/sdcorejs-nestjs/

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'examples/**'
      - 'README.md'
      - 'src/**'
      - 'scripts/check-doc-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install package dependencies
        run: npm ci
      - name: Install documentation dependencies
        run: npm ci --prefix site
      - name: Typecheck library source
        run: npm run typecheck
      - name: Compile consumer example
        run: npm run examples:typecheck
      - name: Validate and build
        run: npm run docs:check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
