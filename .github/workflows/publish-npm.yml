name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: core_test
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: core_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_test -d core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: write # push the version commit + create the tag/GitHub release
      pull-requests: write # open / update the "Version Packages" PR
      id-token: write # npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm ci --prefix site

      - name: Verify release
        env:
          CORE_TEST_DATABASE_URL: postgresql://core_test:core_fixture_only@127.0.0.1:5432/core_test
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run examples:typecheck
          npm run test:coverage
          npm run build
          npm run test:postgres
          npm run test:packed-publication
          npm run check:package-di
          npm run check:exports
          npm pack --dry-run
          npm run docs:check
          node --test scripts/core-release-audit.test.mjs
          node scripts/core-release-audit.mjs

      - name: Create Release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run changeset:version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Retain full audit and packed runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-audit-${{ github.job }}-${{ matrix.node || 'release' }}-${{ github.sha }}
          path: test-results/release-audit/**
          if-no-files-found: warn
          retention-days: 30
